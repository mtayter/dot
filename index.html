<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Game</title>
    <link rel="stylesheet" href="index.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <header><nav></nav></header>
    <main>
        <section><canvas id="board"></canvas></section>
        <aside id="controls">
            <!-- 1. Semantic Match State Group -->
            <section class="score-board" aria-label="Player Scores">
                <div class="score-card active" id="p1Card">
                <label for="player1Score">Player 1</label>
                <output id="player1Score">0</output>
                </div>
                <div class="score-card" id="p2Card">
                <label for="player2Score">Player 2</label>
                <output id="player2Score">0</output>
                </div>
            </section>

            <!-- 2. Semantic Settings Configuration Group -->
            <fieldset class="settings-group">
                <legend class="visually-hidden">Grid Size Settings</legend>
                
                <div class="control-group">
                <label for="heightRange">Height</label>
                <input type="range" min="1" max="20" value="10" id="heightRange">
                <output id="heightValue">10</output>
                </div>
                
                <div class="control-group">
                <label for="widthRange">Width</label>
                <input type="range" min="1" max="20" value="10" id="widthRange">
                <output id="widthValue">10</output>
                </div>

                <input type="button" value="New Game" id="newGameButton">
            </fieldset>
        </aside>
    </main> 
    <footer></footer>
</body>
</html>
